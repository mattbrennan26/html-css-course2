<!DOCTYPE html>

<html>



<head>
  <title>Grid Practice</title>
</head>





<body style="padding-bottom: 1000px">

  <!--creating a grid - outer div like so - display grid and then 100px is defining two columns with 100px-->
  <div style="
        display: grid;
        grid-template-columns: 100px 100px;
      ">

    <div style="background-color: lightblue;">Div 1</div>
    <div style="background-color: lightpink;">Div 2 <p>text</p>
    </div>

  </div>

  <div style="
      margin-top: 30px;
      display: grid;
        grid-template-columns: 100px 100px 200px;
     ">

    <div style="background-color: lightblue;">100px</div>
    <div style="background-color: lightpink;">100px<p>text</p>
    </div>
    <div style="background-color: lightblue;">200px<p>text</p>
    </div>

  </div>

  <div style="
       margin-top: 30px;
        display: grid;
         grid-template-columns: 100px 1fr; 
      ">

    <!--1 fr means free space - take up remaining space on grid-->

    <div style="background-color: lightblue;">100px</div>
    <div style="background-color: lightpink;">1fr</div>
  </div>


  <div style="
       margin-top: 30px;
        display: grid;
         grid-template-columns: 100px 1fr 2fr; 
      ">

    <!--1 fr means free space - take up remaining space on grid can add 2fr as a ratio of remaining space-->

    <div style="background-color: lightblue;">100px</div>
    <div style="background-color: lightpink;">1fr</div>
    <div style="background-color: lightblue;">2fr</div>
  </div>




  <div style="
       margin-top: 30px;
        display: grid;
         grid-template-columns: 1fr 1fr 1fr; 
         column-gap: 20px;
         row-gap: 20px;
      ">

    <!--1 fr means free space - take up remaining space on grid can add 2fr as a ratio of remaining space-->

    <div style="background-color: lightblue; height: 200px">1fr</div>
    <div style="background-color: lightpink; height: 200px">1fr</div>
    <div style="background-color: lightblue; height: 200px">1fr</div>
    <div style="background-color: lightblue; height: 200px">1fr</div>
    <div style="background-color: lightpink; height: 200px">1fr</div>
    <div style="background-color: lightblue; height: 200px">1fr</div>
  </div>


</body>

</html>
